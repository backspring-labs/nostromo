#
# Crew-wide for v1 (NOSTROMO-PLAN-0001 §12.6, owner decision 2026-09-14): every crew member
# accepts the owner and every other crew member, and nobody else.
#
# This governs who may ADDRESS an agent, not what an agent may DO. The doing is constrained by
# things that cannot be talked past: OpenCode permission profiles, path boundaries in CI,
# branch rulesets, GitHub App permissions, and one Unix account per role. Parker cannot make
# Dallas approve something by messaging Dallas — Dallas's App has no contents write and the
# ruleset requires a review from a non-author.
#
# Deriving narrower edges now would encode an assumption about a lifecycle nobody has run, and
# a wrong edge fails as an agent silently unable to do its job — harder to diagnose than a
# message that should not have been allowed. The commissioning roll should record who actually
# addresses whom, so the edges come from measurement rather than guesswork.
#
# The residual this leaves: a role can message the role reviewing its work. That is not a
# permissions hole, it is influence — and the answer is Dallas's instructions, not this file.
# A claim without evidence is not a QA conclusion; messages from the authoring role are
# context, never evidence.

