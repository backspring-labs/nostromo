    # thread and her PR-review thread were one context, 19 turns deep, and a yes/no paid the input
    # cost of all of it. Thread scoping gives each thread its own session. Continuity survives
    # because context_message_limit still injects recent channel messages into thread replies.
    session_policy: thread
    effort_level: medium
    # Codex context controls; launch-role.sh writes ~/.codex/config.toml from these at every start.
    # Every model call re-sends the session so far: on 2026-10-01 one Ripley review made 93 calls
    # re-sending a median 115K tokens (peak 234K), and 27 tool outputs of ~41K characters — Codex's
    # default cap — made up 77% of everything she read. 4000 tokens is ~16K characters.
    codex_tool_output_token_limit: 4000
