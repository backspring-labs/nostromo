# Capability routing table (Bootstrap Plan §16.4).
# Mother resolves a requested capability to an agent here, never from prompt assumptions.
version: 1

capabilities:
  orchestration: mother
  ideation_research: ash
  architecture: ripley
  adversarial_review: dallas
  implementation: parker
  verification: brett
  # Adjacent to verification, not a rename. Ripley's recommendation, 2026-09-20: Brett's governing
