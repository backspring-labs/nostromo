# Nostromo overlay for the upstream Buzz production Compose bundle
# (block/buzz deploy/compose/compose.yml at the commit in upstream.lock). Applied by buzzctl as:
#   docker compose --env-file buzz.env --env-file secrets.env -f compose.yml -f compose.nostromo.yml
# Bootstrap Plan §9.3: only this overlay lives in the repo; the upstream file is fetched at the pin.
# Every image is pinned by registry digest so a re-install reproduces exactly what was validated.
services:
  relay:
    image: ${BUZZ_IMAGE:?set BUZZ_IMAGE in buzz.env}
    # Container env comes from the repo-managed file plus the host-generated secrets file, never a single .env.
    env_file: !override
      - buzz.env
      - secrets.env
    # Publish on loopback only. Tailscale Serve (443, tailnet only) proxies to 3000 and host probes use 8080.
    # Never 0.0.0.0, and no longer the tailnet address: the relay is reached over wss:// through Serve
    # (spec §20, plan §9.6). Tailscale Funnel must never be enabled.
    ports: !override
      - "127.0.0.1:${BUZZ_HTTP_PORT:-3000}:3000"
      - "127.0.0.1:8080:8080"
  # Device pairing for the Buzz mobile app. A SEPARATE binary in the same pinned image, which the
  # upstream Compose bundle does not define — so mobile pairing 404s until this exists. Reachable
  # only through Caddy on the tailnet address, like everything else here.
  pair:
    image: ${BUZZ_IMAGE:?set BUZZ_IMAGE in buzz.env}
    entrypoint: ["/usr/local/bin/buzz-pair-relay"]
    restart: unless-stopped
    environment:
      # 0.0.0.0 inside the container only; nothing is published to the host.
      BUZZ_PAIR_RELAY_BIND_ADDR: "0.0.0.0:5000"
    networks:
      - buzz-net

  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
