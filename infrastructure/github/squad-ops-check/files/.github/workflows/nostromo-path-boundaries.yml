name: nostromo path boundaries

# Runs on every pull request and ALWAYS reports a status. There is deliberately no
# job-level `if:` — a required check that reports "skipped" can leave a pull request
# waiting for a status that never arrives. The script itself decides, and returns
# success immediately for any branch that is not a Nostromo crew branch.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  boundaries:
    name: nostromo path boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List the files this pull request changes
        env:
          GH_TOKEN: ${{ github.token }}
        # The API rather than `git diff`: no full history to fetch, and it behaves the
        # same for a pull request opened from a fork.
        run: gh pr view "${{ github.event.pull_request.number }}" --json files --jq '.files[].path' > changed-files.txt

      - name: Check the crew path boundary
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/dev/check_nostromo_path_boundaries.py \
            --branch "${{ github.event.pull_request.head.ref }}" \
            --files-from changed-files.txt
